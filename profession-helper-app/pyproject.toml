[project]
name = "profession-helper-app"
version = "0.1.0"
description = "Discord-Bot fuer Gilden-Berufe und Rezepte (WoW: Forever)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "sqlalchemy>=2.0.36",
    # psycopg 3 mit vorkompilierten Wheels - auf dem Pi (arm64) gibt es die,
    # und ohne sie muesste dort ein C-Compiler stehen.
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
# Ohne das findet pytest die Projektmodule nicht: Die Tests importieren
# `utils.textnorm`, und die Projektwurzel liegt nicht automatisch im sys.path.
pythonpath = ["."]
testpaths = ["tests"]
